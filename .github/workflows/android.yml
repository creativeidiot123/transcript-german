name: Android

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Inspect pinned Canary tokens
        run: |
          url="https://huggingface.co/csukuangfj/sherpa-onnx-nemo-canary-180m-flash-en-es-de-fr-int8/resolve/b3fd7d9883a92f767be20b3792b9d54883a2f18f/tokens.txt?download=true"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/canary-tokens.txt"
          wc -c "$RUNNER_TEMP/canary-tokens.txt"
          sha256sum "$RUNNER_TEMP/canary-tokens.txt"

      - name: Unit tests, lint, and builds
        run: >
          gradle
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          :app:bundleRelease
          --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: transcript-german-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
