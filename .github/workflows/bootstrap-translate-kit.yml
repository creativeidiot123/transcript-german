name: Bootstrap translate-kit dependency

on:
  push:
    branches:
      - feature/dual-language-bergamot
    paths:
      - .github/workflows/bootstrap-translate-kit.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          repository: marcosholgado/translate-kit
          ref: 2dcdcb1559ed405d65ae1ff1e786d3a5ebb933c4
          path: translate-kit
          submodules: false

      - name: Initialize pinned engine sources
        working-directory: translate-kit
        run: |
          set -euo pipefail
          git submodule update --init --recursive third_party/cld2
          git submodule update --init third_party/translations
          git -C third_party/translations submodule update --init --recursive \
            inference/3rd_party/ssplit-cpp \
            inference/marian-fork/src/3rd_party/sentencepiece \
            inference/marian-fork/src/3rd_party/intgemm \
            inference/marian-fork/src/3rd_party/ruy \
            inference/marian-fork/src/3rd_party/simd_utils
          bash scripts/apply-engine-patches.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build Android AAR
        working-directory: translate-kit/android
        run: ./gradlew :translate-kit:assembleRelease --no-daemon

      - name: Publish pinned dependency asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src="translate-kit/android/translate-kit/build/outputs/aar/translate-kit-release.aar"
          out="translate-kit-android-0.1.0.aar"
          cp "$src" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "Native libraries in AAR:"
          unzip -l "$out" | grep 'jni/' || true
          tag="deps-translate-kit-0.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$out" "$out.sha256" --clobber
          else
            gh release create "$tag" "$out" "$out.sha256" \
              --target main \
              --title "Pinned dependency: translate-kit 0.1.0" \
              --notes "Android AAR built from marcosholgado/translate-kit v0.1.0 commit 2dcdcb1559ed405d65ae1ff1e786d3a5ebb933c4. The upstream project is Apache-2.0 and statically links the Bergamot/MPL-2.0 inference layer plus its documented third-party components."
          fi
